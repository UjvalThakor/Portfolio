services:
  - type: web
    name: ujval-portfolio
    runtime: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: "/api/health/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CONTACT_NOTIFICATION_EMAIL
        value: "ujvalthakor14@gmail.com"
      - key: DATABASE_URL
        fromDatabase:
          name: ujval-portfolio-db
          property: connectionString

databases:
  - name: ujval-portfolio-db
    plan: free
    region: oregon
    databaseName: portfolio
    user: ujval
