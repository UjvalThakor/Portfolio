<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — Server Error | Ujval Thakor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..900;1,9..40,300..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #fefff8;
      color: #000000;
      font-family: 'DM Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .container { max-width: 680px; margin: 0 auto; }
    .mono-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: #ff5d1f;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
    }
    h1 {
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 1.5rem;
    }
    .accent { color: #ff5d1f; }
    p {
      font-size: 1.1rem;
      color: #555555;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.8rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    .btn-primary { background: #000000; color: #ffffff; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-secondary { border: 1px solid rgba(0, 0, 0, 0.2); color: #000000; }
    .btn-secondary:hover { background: rgba(0,0,0,0.04); }
  </style>
</head>
<body>
  <div class="container">
    <div class="mono-tag">// 500 INTERNAL SERVER ERROR</div>
    <h1>SYSTEM <span class="accent">ANOMALY</span>.</h1>
    <p>
      An unexpected condition occurred within the backend service. The application state is preserved, and our error telemetry has flagged this incident for review.
    </p>
    <div class="btn-group">
      <a href="/" class="btn btn-primary">
        <span>RETURN TO HOME</span>
        <span>→</span>
      </a>
      <a href="/projects/" class="btn btn-secondary">
        <span>VIEW PROJECTS</span>
      </a>
    </div>
  </div>
</body>
</html>
