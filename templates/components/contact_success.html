<div class="contact-form-container" id="contact-form-wrapper" style="text-align: center; padding: 3.5rem 2rem;">
  <div style="width: 52px; height: 52px; border-radius: 50%; background: rgba(13, 242, 147, 0.1); border: 1px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 1.5rem;">
    ✓
  </div>
  <h3 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; text-transform: uppercase; margin-bottom: 0.75rem;">
    MESSAGE DELIVERED
  </h3>
  <p style="color: var(--text-muted); font-size: 1rem; line-height: 1.6; max-width: 440px; margin: 0 auto 2rem;">
    Thank you <strong>{{ name }}</strong>. Your inquiry regarding "<em>{{ subject }}</em>" has been validated and persisted to Ujval's backend database. Expect an engineering response shortly.
  </p>
  <button type="button" class="btn btn-secondary btn-sm" onclick="location.reload();">
    SEND ANOTHER MESSAGE
  </button>
</div>
